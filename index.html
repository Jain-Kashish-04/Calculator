<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Calculator</title>
    <!-- Tailwind CSS CDN -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
				
</head>

	<body>
		<div class="min-h-screen bg-white flex flex-col items-center justify-center">
			<h1 class="text-2xl font-bold mb-5 text-gray-900"> CALCULATOR APP </h1>

			<div class="w-[405px] bg-white rounded-xl p-4 shadow-[0_8px_20px_rgba(0,0,0,0.25)] border border-black h-[350px]">
				<div class="flex items-center gap-2 mb-3 h-30 bg-sky-500">
					
				</div>
				
				<div class="grid grid-cols-4 gap-1.5">
					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm  text-xl text-gray-700 shadow-sm">7</button>
					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">8</button>
					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">9</button>
					<button class="h-10 bg-gray-40 border border-yellow-600 text-black text-xl shadow-sm">/</button>


					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">4</button>
					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">5</button>
					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">6</button>
					<button class="h-10 bg-white-400 border border-yellow-600 text-black text-xl shadow-sm">*</button>


					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">1</button>
					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">2</button>
					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">3</button>
					<button class="h-10 bg-white-400 border border-yellow-600 text-black text-xl shadow-sm">-</button>


					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">0</button>
					<button class="h-10 bg-gray-50 border border-black-200 rounded-sm text-xl text-gray-700 shadow-sm">.</button>
					<button class="h-10 bg-sky-500 border border-black-200 text-white text-lg font-semibold shadow-sm">=</button>
					<button class="h-10 bg-white-400 border border-yellow-600 text-black text-xl shadow-sm">+</button>
				</div>
			</div>

		</div>
		
		<script>
		
		
		
		
		
		</script>

	
	</body>
</html>
